# The Wardens' wasteland, as a mapsmith spec.
#
#   python wardens/tools/mapsmith preview wardens/maps/wardens-wasteland.map.toml
#   python wardens/tools/mapsmith build   wardens/maps/wardens-wasteland.map.toml
#
# The land the Chapter 1 plan needs (design/wardens-wasteland.md): badwater from the north, ruins
# for scrap within scavenging range of the Core, one clean spring in the north-east and nothing
# else green, an ash plateau ringed by hills. `wardens/tools/gen_map.py` wrote the currently
# shipped `.timber` from hand-written numpy; this spec is the same design expressed as data.
name = "Wardens Wasteland"
size = 96
seed = 3000
game_version = "0.7.10.0"          # the layout verified in design/wardens-wasteland.md; the game migrates it
description = "The Wardens' wasteland. Badwater from the north, ruins for scrap, one clean spring in the north-east. Bots only."

# --- the land ------------------------------------------------------------------------------------

[[terrain]]
op = "base"
height = 6

[[terrain]]                        # rolling ash, Z 6..9
op = "noise"
amplitude = 3.4
contrast = 1.9
octaves = [8, 16, 32]
weights = [1.0, 0.5, 0.25]

[[terrain]]                        # a rim of hills, so the interior reads as a basin
op = "rim"
width = 10
height = 5
exponent = 2.0

[[terrain]]                        # the clean spring's hill in the north-east
op = "hill"
at = [82, 14]
radius = 13
height = 6
floor = 8
name = "spring"

[[terrain]]                        # the badwater river: enters north, meanders, leaves south
op = "river"
points = [[34, -2], [36, 14], [52, 26], [38, 42], [30, 47], [40, 58], [62, 66], [56, 82], [48, 98]]
bed = 4
width = 1.7
valley = [[4.5, 7], [3.0, 6]]
tag = "badwater"
name = "river"

[[terrain]]                        # the Sump beside the start — the Sludge Pump goes here
op = "basin"
at = [31, 46]
radii = [5, 4]
bed = 4
shore = 6
tag = "badwater"
name = "sump"

[[terrain]]                        # the spring pool, in a crater on the hilltop
op = "crater"
at = "spring"
radius = 2.6
depth = 2
tag = "clean"

[[terrain]]                        # its overflow runs north off the map
op = "channel"
start = "spring"
direction = "north"
length = 40
drop = 6
offset = 3
tag = "clean"

[[terrain]]                        # the Core's flat pad, above the Sump
op = "pad"
at = [20, 46]
size = 8
height = 8
name = "start"
reserve = 3

[[terrain]]
op = "clamp"
min = 3
max = 19

# --- water ---------------------------------------------------------------------------------------

[[place]]
template = "BadwaterSource"
along = "badwater"
segment = [0.0, 0.04]              # the head of the river, at the north edge
count = 3
strength = 4.0
orientation = "Cw0"

[[place]]
template = "WaterSource"
at = "spring"
strength = 1.5
orientation = "Cw0"

# --- the colony ------------------------------------------------------------------------------------

[[place]]
template = "StartingLocation"
at = "start"
dx = -2
dy = -2
orientation = "Cw0"

# --- ruins: scrap is the only building material ------------------------------------------------------

[[scatter]]
name = "near ruins"                # chapter 1 scrap, 8-13 tiles from the Core
templates = ["RuinColumnH1", "RuinColumnH2", "RuinColumnH3"]
weights = [3, 3, 1]
levels = [1, 2, 3]
around = [15, 40]
radius = 5.0
count = 7
spacing = 2
height_range = [6, 10]
variants = ["A", "B", "C"]
orientation = "Cw0"
yield = { good = "ScrapMetal", amount_per_level = 15 }

[[scatter]]
name = "south of the pad"
templates = ["RuinColumnH1", "RuinColumnH2", "RuinColumnH3"]
weights = [2, 3, 2]
levels = [1, 2, 3]
around = [26, 55]
radius = 4.5
count = 6
spacing = 2
height_range = [6, 10]
variants = ["A", "B", "C"]
orientation = "Cw0"
yield = { good = "ScrapMetal", amount_per_level = 15 }

[[scatter]]
name = "across the river"          # a reason to build the first bridge
templates = ["RuinColumnH2", "RuinColumnH3", "RuinColumnH5"]
weights = [2, 3, 2]
levels = [2, 3, 5]
around = [66, 36]
radius = 6.0
count = 9
spacing = 2
height_range = [6, 12]
variants = ["A", "B", "C"]
orientation = "Cw0"
yield = { good = "ScrapMetal", amount_per_level = 15 }

[[scatter]]
name = "the south field"           # tall and rich, a mid-game expedition
templates = ["RuinColumnH3", "RuinColumnH5"]
weights = [1, 1]
levels = [3, 5]
around = [24, 78]
radius = 6.0
count = 9
spacing = 2
height_range = [6, 12]
variants = ["A", "B", "C"]
orientation = "Cw0"
yield = { good = "ScrapMetal", amount_per_level = 15 }

[[scatter]]
name = "the far corner"
templates = ["RuinColumnH2", "RuinColumnH3", "RuinColumnH5"]
weights = [2, 2, 1]
levels = [2, 3, 5]
around = [74, 78]
radius = 5.0
count = 6
spacing = 2
height_range = [6, 12]
variants = ["A", "B", "C"]
orientation = "Cw0"
yield = { good = "ScrapMetal", amount_per_level = 15 }

[[scatter]]
name = "underground ruins"         # inside the plateau, for the mines of a later act
template = "UndergroundRuins"
around = "start"
radius = [8, 28]
count = 6
spacing = 3
height_range = [7, 12]
buried = 3
margin = 4
orientation = "Cw0"

# --- the only green ----------------------------------------------------------------------------------

[[scatter]]
name = "spring grove"
templates = ["Pine", "Birch", "BlueberryBush"]
weights = [45, 40, 15]
around = "spring"
radius = [3.5, 11.5]
count = 120
spacing = 1
growth = [0.7, 1.0]
margin = 2

[[scatter]]
name = "lone birches"              # "there is not much"
templates = ["Birch", "Pine"]
weights = [7, 3]
around = [48, 48]
radius = [20, 44]
count = 40
spacing = 3
margin = 4
growth = [0.7, 1.0]
away_from = { badwater = 9.0, clean = 6.0, start = 16.0, spring = 16.0 }

# --- soil ----------------------------------------------------------------------------------------

[soil]
contamination = { from = "badwater", offset = 2.5, reach = 6.0 }

# --- what the checker must be able to prove ---------------------------------------------------------

[checks]
require = ["StartingLocation", "BadwaterSource", "WaterSource"]
require_at_least = { RuinColumnH1 = 3 }
min_reachable = 1500
# Chapter 1 has to be playable on foot; the fields across the river are meant to need a bridge,
# so they are deliberately absent from this list. `reachable = ["RuinColumn"]` cannot say that —
# all five clusters use the same templates.
reachable_scatter = ["near ruins", "south of the pad"]
