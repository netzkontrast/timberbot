# The campaign's map index: which spec builds which level's land.
#
#   python wardens/tools/mapsmith levels                 # what exists, what is missing
#   python wardens/tools/mapsmith build --level 02       # build one level by id
#   python wardens/tools/mapsmith check  --level 02
#
# The C# table in `wardens/src/WardensCampaign.cs` (`WardensCampaignService.Levels`) is the campaign:
# it says which levels exist, what each is called, and which tutorial ends it. This file says only
# where each level's land comes from. `mapsmith levels --verify` reads both and reports any
# disagreement, because a map name that does not match `MapNameService.Name` means the campaign
# service silently decides "not a campaign level" and the whole chapter line goes quiet.
#
# `map` must equal the C# row's MapName exactly — it is the .timber file name and the key the
# campaign is looked up by.

[levels."01"]
map = "Wardens 01 First Light"
title = "First Light"
spec = "wardens-01-first-light.map.toml"
generator = "mapsmith"
note = """Remade 2026-09-11 from the level-01 playtest (PLAYTEST.md): the spec owns the shipped file
now. gen_map.py wrote the first version (Sump under a cliff, filled on day 5, spring unreachable);
saves made on it keep that land, since a save carries its world. The name stays, so the campaign
still finds the level; level 10 regenerates from this spec."""

[levels."02"]
map = "Wardens 02 The Sump"
title = "The Sump"
spec = "wardens-02-the-sump.map.toml"
generator = "mapsmith"

